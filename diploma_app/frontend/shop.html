<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Shop</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <header class="shop-header">
        <button id="back-btn">Back</button>
        <button id="create-shop-btn">Create Shop</button>
    </header>

    <main id="shop-content" class="shop-container">
        <form id="shop-form" class="hidden">
            <label for="shop-name">Name</label>
            <input type="text" id="shop-name" name="name" required maxlength="100" />
            <label for="shop-description">Description</label>
            <textarea id="shop-description" name="description" required maxlength="200"></textarea>
            <button type="submit">Create</button>
        </form>

        <section id="shop-view" class="hidden">
            <div class="shop-info">
                <h2 id="shop-title"></h2>
                <p id="shop-description-text"></p>
            </div>
            <div class="role-bar">
                <span id="current-role"></span>
                <button id="toggle-role-btn">Toggle Role</button>
            </div>
            <div class="admin-section hidden">
                <button id="create-product-btn">Create Product</button>
                <ul id="product-list" class="product-list"></ul>
            </div>
            <div class="user-section hidden">
                <ul id="user-product-list" class="product-list"></ul>
                <a href="/cart.html" class="cart-link">🛒 Cart</a>
            </div>
        </section>
    </main>

    <script src="/static/shop.js"></script>
</body>

</html>
