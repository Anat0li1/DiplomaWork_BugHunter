<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій магазин</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="/index.html">Головна</a>
            <a href="/shop.html" class="active">Мій магазин</a>
            <a href="/products.html">Продукти</a>
            <a href="/cart.html">Кошик</a>
            <a href="/orders.html">Замовлення</a>
            <button id="logout-btn">Вийти</button>
        </nav>
    </header>
    <div class="container">
        <h1>Керування магазином</h1>
        <div id="message-area" class="message"></div>
        <form id="shop-form">
            <input type="hidden" id="shop-exists" value="false">
            <input type="text" id="shop-name" placeholder="Назва магазину" required>
            <textarea id="shop-description" placeholder="Опис магазину" required></textarea>
            <button type="submit">Зберегти</button>
        </form>
        <button id="delete-shop-btn" class="danger" style="display: none;">Видалити магазин</button>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/shop.js"></script>
</body>

</html>
