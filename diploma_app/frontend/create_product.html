<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Product</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <header class="shop-header">
        <button id="cancel-btn">Cancel</button>
    </header>

    <main class="form-container">
        <form id="product-form">
            <label for="product-name">Name</label>
            <input type="text" id="product-name" name="name" required maxlength="100" />

            <label for="product-description">Description</label>
            <textarea id="product-description" name="description" required maxlength="200"></textarea>

            <label for="product-price">Price</label>
            <input type="number" step="0.01" id="product-price" name="price" required />

            <label for="product-quantity">Quantity</label>
            <input type="number" id="product-quantity" name="quantity" required />

            <button type="submit">Create</button>
        </form>
    </main>

    <script src="/static/create_product.js"></script>
</body>

</html>
