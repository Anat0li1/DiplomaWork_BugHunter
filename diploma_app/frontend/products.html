<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продукти</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="/index.html">Головна</a>
            <a href="/shop.html">Мій магазин</a>
            <a href="/products.html" class="active">Продукти</a>
            <a href="/cart.html">Кошик</a>
            <a href="/orders.html">Замовлення</a>
            <button id="logout-btn">Вийти</button>
        </nav>
    </header>
    <div class="container">
        <h1>Мої продукти</h1>
        <div id="message-area" class="message"></div>

        <form id="product-form">
            <h3>Додати/Оновити продукт</h3>
            <input type="hidden" id="product-id">
            <input type="text" id="product-name" placeholder="Назва продукту" required>
            <textarea id="product-description" placeholder="Опис продукту" required></textarea>
            <input type="number" id="product-price" placeholder="Ціна" step="0.01" min="0" required>
            <input type="number" id="product-quantity" placeholder="Кількість" min="0" required>
            <button type="submit">Зберегти продукт</button>
            <button type="button" id="cancel-edit-btn" style="display: none;">Скасувати редагування</button>
        </form>

        <h2>Список продуктів</h2>
        <table id="products-table">
            <thead>
                <tr>
                    <th>Назва</th>
                    <th>Ціна</th>
                    <th>Кількість</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/products.js"></script>
</body>

</html>
