<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>User Profile</title>
    <link rel="stylesheet" href="static/style.css" />
</head>

<body>
    <div class="header">
        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
        </div>
        <div class="user-dropdown">
            <span class="dropdown-toggle">Menu ▾</span>
            <div class="dropdown-menu">
                <a href="/me.html">My Profile</a>
                <a href="#" class="toggle-role-btn">Switch Role</a>
                <a href="#" class="logout-btn">Logout</a>
            </div>
        </div>
    </div>

    <main class="dashboard-content">
        <h2>My Account</h2>
        <div class="user-details">
            <p><strong>Email:</strong> <span class="user-email"></span></p>
            <p><strong>Username:</strong> <span class="user-username"></span></p>
            <p><strong>Active Role:</strong> <span class="user-role"></span></p>
        </div>
    </main>

    <script src="static/me.js"></script>
    <script src="static/dropdown.js"></script>
</body>

</html>
